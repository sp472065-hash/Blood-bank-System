```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blood Bank Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f5f5f5;
            color: #333;
        }

        header {
            background-color: #c62828;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin-bottom: 8px;
        }

        header p {
            font-size: 15px;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 25px auto;
        }

        .card {
            background-color: white;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            color: #c62828;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        button {
            background-color: #c62828;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background-color: #a61c1c;
        }

        .search-box {
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #c62828;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .delete-btn {
            background-color: #555;
            padding: 7px 12px;
            font-size: 13px;
        }

        .delete-btn:hover {
            background-color: #333;
        }

        .stock-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
        }

        .blood-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            background-color: #fff;
        }

        .blood-group {
            font-size: 22px;
            font-weight: bold;
            color: #c62828;
            margin-bottom: 8px;
        }

        .stock-count {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .available {
            color: green;
            font-weight: bold;
        }

        .not-available {
            color: red;
            font-weight: bold;
        }

        .message {
            padding: 12px;
            margin-top: 15px;
            border-radius: 5px;
            display: none;
            font-weight: bold;
        }

        .success {
            background-color: #d4edda;
            color: #155724;
        }

        .error {
            background-color: #f8d7da;
            color: #721c24;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        @media (max-width: 600px) {
            .container {
                width: 95%;
            }

            table {
                font-size: 13px;
            }

            th,
            td {
                padding: 7px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>🩸 Blood Bank Management System</h1>
        <p>Simple Blood Donor and Blood Stock Management</p>
    </header>

    <div class="container">

        <!-- Add Donor Section -->
        <div class="card">
            <h2>➕ Add Donor</h2>

            <form id="donorForm">

                <div class="form-group">
                    <label for="donorName">Donor Name</label>
                    <input
                        type="text"
                        id="donorName"
                        placeholder="Enter donor name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="bloodGroup">Blood Group</label>
                    <select id="bloodGroup" required>
                        <option value="">Select Blood Group</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter phone number"
                        required
                    >
                </div>

                <button type="submit">Add Donor</button>

                <div id="message" class="message"></div>

            </form>
        </div>


        <!-- Blood Search Section -->
        <div class="card">
            <h2>🔍 Search Blood Group</h2>

            <div class="search-box">
                <select id="searchBloodGroup">
                    <option value="">Select Blood Group</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                </select>
            </div>

            <div id="searchResult"></div>
        </div>


        <!-- Blood Stock Section -->
        <div class="card">
            <h2>🩸 Available Blood Stock</h2>

            <div id="stockContainer" class="stock-container">
            </div>
        </div>


        <!-- Donor List Section -->
        <div class="card">
            <h2>👥 Donor List</h2>

            <table>
                <thead>
                    <tr>
                        <th>S.No</th>
                        <th>Name</th>
                        <th>Blood Group</th>
                        <th>Phone Number</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="donorTableBody">
                </tbody>
            </table>

        </div>

    </div>


    <footer>
        <p>Blood Bank Management System | Student Mini Project</p>
    </footer>


    <script>

        /*
         * ==========================================
         * BLOOD BANK MANAGEMENT SYSTEM
         * USING LOCAL STORAGE
         * ==========================================
         */


        // ------------------------------------------
        // Load donor data from Local Storage
        // ------------------------------------------

        let donors = JSON.parse(localStorage.getItem("bloodBankDonors")) || [];


        // ------------------------------------------
        // Blood groups
        // ------------------------------------------

        const bloodGroups = [
            "A+",
            "A-",
            "B+",
            "B-",
            "AB+",
            "AB-",
            "O+",
            "O-"
        ];


        // ------------------------------------------
        // Save donors to Local Storage
        // ------------------------------------------

        function saveToLocalStorage() {

            localStorage.setItem(
                "bloodBankDonors",
                JSON.stringify(donors)
            );

        }


        // ------------------------------------------
        // Add donor
        // ------------------------------------------

        document.getElementById("donorForm").addEventListener(
            "submit",
            function(event) {

                event.preventDefault();

                const name =
                    document.getElementById("donorName").value.trim();

                const bloodGroup =
                    document.getElementById("bloodGroup").value;

                const phone =
                    document.getElementById("phone").value.trim();


                // Check empty fields
                if (
                    name === "" ||
                    bloodGroup === "" ||
                    phone === ""
                ) {

                    showMessage(
                        "Please fill all fields.",
                        "error"
                    );

                    return;
                }


                // Create donor object
                const donor = {
                    name: name,
                    bloodGroup: bloodGroup,
                    phone: phone
                };


                // Add donor to array
                donors.push(donor);


                // Save donor data
                saveToLocalStorage();


                // Clear form
                document.getElementById("donorForm").reset();


                // Update display
                displayDonors();
                displayStock();


                showMessage(
                    "Donor added successfully!",
                    "success"
                );

            }
        );


        // ------------------------------------------
        // Display donors
        // ------------------------------------------

        function displayDonors() {

            const tableBody =
                document.getElementById("donorTableBody");

            tableBody.innerHTML = "";


            if (donors.length === 0) {

                tableBody.innerHTML = `
                    <tr>
                        <td colspan="5">
                            No donors added yet.
                        </td>
                    </tr>
                `;

                return;
            }


            donors.forEach(function(donor, index) {

                const row =
                    document.createElement("tr");


                row.innerHTML = `
                    <td>${index + 1}</td>

                    <td>${donor.name}</td>

                    <td>${donor.bloodGroup}</td>

                    <td>${donor.phone}</td>

                    <td>
                        <button
                            class="delete-btn"
                            onclick="deleteDonor(${index})">
                            Delete
                        </button>
                    </td>
                `;


                tableBody.appendChild(row);

            });

        }


        // ------------------------------------------
        // Delete donor
        // ------------------------------------------

        function deleteDonor(index) {

            if (
                confirm(
                    "Are you sure you want to delete this donor?"
                )
            ) {

                // Remove donor
                donors.splice(index, 1);


                // Save updated list
                saveToLocalStorage();


                // Update display
                displayDonors();
                displayStock();


                // Update search result
                const selectedGroup =
                    document.getElementById(
                        "searchBloodGroup"
                    ).value;


                if (selectedGroup !== "") {

                    searchBlood();

                }

            }

        }


        // ------------------------------------------
        // Display blood stock
        // ------------------------------------------

        function displayStock() {

            const stockContainer =
                document.getElementById("stockContainer");

            stockContainer.innerHTML = "";


            bloodGroups.forEach(function(group) {


                // Count donors for blood group
                const count =
                    donors.filter(function(donor) {

                        return donor.bloodGroup === group;

                    }).length;


                let availabilityText = "";


                if (count > 0) {

                    availabilityText =
                        `<div class="available">
                            Blood Available
                         </div>`;

                } else {

                    availabilityText =
                        `<div class="not-available">
                            Blood Not Available
                         </div>`;

                }


                const bloodCard =
                    document.createElement("div");

                bloodCard.className = "blood-card";


                bloodCard.innerHTML = `
                    <div class="blood-group">
                        ${group}
                    </div>

                    <div class="stock-count">
                        Stock: ${count}
                    </div>

                    ${availabilityText}
                `;


                stockContainer.appendChild(bloodCard);

            });

        }


        // ------------------------------------------
        // Search blood group
        // ------------------------------------------

        document.getElementById("searchBloodGroup")
            .addEventListener(
                "change",
                searchBlood
            );


        function searchBlood() {

            const selectedGroup =
                document.getElementById(
                    "searchBloodGroup"
                ).value;


            const searchResult =
                document.getElementById(
                    "searchResult"
                );


            // Nothing selected
            if (selectedGroup === "") {

                searchResult.innerHTML = "";

                return;
            }


            // Find matching donors
            const matchingDonors =
                donors.filter(function(donor) {

                    return donor.bloodGroup === selectedGroup;

                });


            // Blood available
            if (matchingDonors.length > 0) {

                let html = `
                    <div
                        class="message success"
                        style="display:block;"
                    >
                        Blood Available for ${selectedGroup}
                        <br>
                        Stock: ${matchingDonors.length}
                    </div>

                    <h3 style="margin-top:15px;">
                        Available Donors
                    </h3>

                    <table>

                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Phone Number</th>
                            </tr>
                        </thead>

                        <tbody>
                `;


                matchingDonors.forEach(function(donor) {

                    html += `
                        <tr>
                            <td>${donor.name}</td>
                            <td>${donor.phone}</td>
                        </tr>
                    `;

                });


                html += `
                        </tbody>

                    </table>
                `;


                searchResult.innerHTML = html;

            }


            // Blood not available
            else {

                searchResult.innerHTML = `
                    <div
                        class="message error"
                        style="display:block;"
                    >
                        Blood Not Available for
                        ${selectedGroup}
                    </div>
                `;

            }

        }


        // ------------------------------------------
        // Show messages
        // ------------------------------------------

        function showMessage(text, type) {

            const message =
                document.getElementById("message");


            message.textContent = text;


            message.className =
                "message " + type;


            message.style.display = "block";


            setTimeout(function() {

                message.style.display = "none";

            }, 3000);

        }


        // ------------------------------------------
        // Load saved data when page opens
        // ------------------------------------------

        displayStock();

        displayDonors();

    </script>

</body>
</html>
